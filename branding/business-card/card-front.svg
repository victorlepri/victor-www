<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1126" height="676" viewBox="0 0 1126 676">
<defs><linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#e11a5f"/><stop offset="0.3" stop-color="#ff3ea0"/><stop offset="0.7" stop-color="#ff3ea0" stop-opacity="0"/>
</linearGradient></defs>
<!--L:ground-->
<g inkscape:groupmode="layer" id="layer-ground" inkscape:label="the ground">
<rect width="1126" height="676" fill="#050507"/>
</g>
<!--/L-->
<!--L:mark-->
<g inkscape:groupmode="layer" id="layer-mark" inkscape:label="the mark">
<g shape-rendering="crispEdges" transform="translate(110,100) scale(8.25)">
<rect x="1" y="5" width="1" height="1" fill="#e11a5f"/>
<rect x="2" y="4" width="1" height="1" fill="#ff3ea0"/>
<rect x="4" y="5" width="1" height="1" fill="#e11a5f"/>
<rect x="6" y="3" width="1" height="1" fill="#ffe0f0"/>
</g>
</g>
<!--/L-->
<!--L:name-->
<g inkscape:groupmode="layer" id="layer-name" inkscape:label="the name">
<text x="216" y="136" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="35" letter-spacing="8.4" fill="#f0ecf4" font-weight="300">VICTOR LEPRI</text>
</g>
<!--/L-->
<!--L:slogan-->
<g inkscape:groupmode="layer" id="layer-slogan" inkscape:label="the front slogan">
<text x="216" y="176" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="16" letter-spacing="3.5" fill="#e11a5f">ART IS TECHNOLOGY</text>
</g>
<!--/L-->
<!--L:email-->
<g inkscape:groupmode="layer" id="layer-email" inkscape:label="the email">
<text x="116" y="514" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="22" letter-spacing="3.1" fill="#f0ecf4">hello@victorlepri.com</text>
</g>
<!--/L-->
<!--L:phone-->
<g inkscape:groupmode="layer" id="layer-phone" inkscape:label="the phone">
<text x="116" y="556" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="22" letter-spacing="3.1" fill="#f0ecf4">+1 (240) 535-3958</text>
</g>
<!--/L-->
<!--L:site-->
<g inkscape:groupmode="layer" id="layer-site" inkscape:label="the site">
<text x="1010" y="556" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="22" letter-spacing="3.1" fill="#e11a5f" text-anchor="end">victorlepri.com</text>
</g>
<!--/L-->
<!--L:rule-->
<g inkscape:groupmode="layer" id="layer-rule" inkscape:label="the gradient rule">
<rect x="0" y="670" width="1126" height="6" fill="url(#rule)"/>
</g>
<!--/L-->
</svg>