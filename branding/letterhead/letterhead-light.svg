<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="2550" height="3300" viewBox="0 0 2550 3300">
<defs><linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#c41555"/><stop offset="0.3" stop-color="#e0287a"/><stop offset="0.7" stop-color="#e0287a" stop-opacity="0"/>
</linearGradient></defs>
<!--L:ground-->
<g inkscape:groupmode="layer" id="layer-ground" inkscape:label="the ground">
<rect width="2550" height="3300" fill="#ffffff"/>
</g>
<!--/L-->
<!--L:mark-->
<g inkscape:groupmode="layer" id="layer-mark" inkscape:label="the mark">
<g shape-rendering="crispEdges" transform="translate(225,205) scale(13)">
<rect x="1" y="5" width="1" height="1" fill="#c41555"/>
<rect x="2" y="4" width="1" height="1" fill="#e0287a"/>
<rect x="4" y="5" width="1" height="1" fill="#c41555"/>
<rect x="6" y="3" width="1" height="1" fill="#2a48ff"/>
</g>
</g>
<!--/L-->
<!--L:name-->
<g inkscape:groupmode="layer" id="layer-name" inkscape:label="the name">
<text x="390" y="268" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="44" letter-spacing="10.5" fill="#0d0c10" font-weight="300">VICTOR LEPRI</text>
</g>
<!--/L-->
<!--L:slogan-->
<g inkscape:groupmode="layer" id="layer-slogan" inkscape:label="the slogan">
<text x="390" y="318" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="20" letter-spacing="4.4" fill="#c41555">TECHNOLOGY IS ART</text>
</g>
<!--/L-->
<!--L:domain-->
<g inkscape:groupmode="layer" id="layer-domain" inkscape:label="the domain">
<text x="2325" y="3105" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="22" letter-spacing="3" fill="#b0acba" text-anchor="end">victorlepri.com</text>
</g>
<!--/L-->
<!--L:rule-->
<g inkscape:groupmode="layer" id="layer-rule" inkscape:label="the gradient rule">
<rect x="0" y="3288" width="2550" height="12" fill="url(#rule)"/>
</g>
<!--/L-->
</svg>